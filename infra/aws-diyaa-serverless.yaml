  AdminIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DiyaaRestApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AdminLambda.Arn
      PayloadFormatVersion: '2.0'

  LoginRoute:
