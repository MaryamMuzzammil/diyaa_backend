Outputs:
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref DiyaaUsersPool
  CognitoClientId:
    Description: Cognito App Client ID
    Value: !Ref DiyaaUsersClient
  ApiGatewayBaseUrl:
    Description: API Gateway Base URL
    Value: !Sub https://${DiyaaRestApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  DynamoDBTableNames:
    Description: DynamoDB table names
    Value: !Join
      - ','
      - - !Ref UsersTable
        - !Ref SchoolsTable
        - !Ref SubjectsTable
        - !Ref GamesTable
        - !Ref ScoresXPTable
        - !Ref StudentProgressTable
